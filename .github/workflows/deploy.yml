name: Deploy

# Deployment remains inactive for ordinary pushes until the approved
# root-repository handoff. Use workflow_dispatch only after Pages is enabled
# for the replacement repository.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v4
      - uses: astral-sh/setup-uv@v7
      - name: Clean build and black-box audit
        run: uv run scripts/accept.py --skip-self-test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

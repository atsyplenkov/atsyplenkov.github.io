name: Deploy

# After the root-repository handoff (rename to atsyplenkov.github.io + Pages
# source = GitHub Actions), this workflow publishes the certified replacement
# at the default user-site URL https://atsyplenkov.github.io for pre-cutover
# staging. Canonical domain and Netlify DNS are unchanged until a later phase.
#
# Production build + black-box audit always gate the Pages artifact.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v4
      - uses: astral-sh/setup-uv@v7
      - name: Clean build and black-box audit
        run: uv run scripts/accept.py --skip-self-test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

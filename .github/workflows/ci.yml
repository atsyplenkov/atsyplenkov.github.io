name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Build and audit only. Publishing is handled by the separate Deploy workflow
# (push to main / workflow_dispatch).
permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v4
      - uses: astral-sh/setup-uv@v7
      - name: Clean build and black-box audit
        run: uv run scripts/accept.py
